---
- name: Administrar dos servidores Ubuntu en Docker
  hosts: docker
  gather_facts: true
  tasks:
    - name: Mostrar nombre del host
      ansible.builtin.debug:
        msg: "Servidor: {{ inventory_hostname }}"

    - name: Mostrar sistema operativo
      ansible.builtin.debug:
        msg: "Sistema operativo: {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Crear directorio principal
      ansible.builtin.file:
        path: /tmp/ansible-demo
        state: directory
        mode: '0755'

    - name: Crear directorios mediante un bucle
      ansible.builtin.file:
        path: "/tmp/ansible-demo/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - logs
        - backup
        - config

    - name: Crear info.txt con los datos del servidor
      ansible.builtin.copy:
        dest: /tmp/ansible-demo/info.txt
        content: |
          Servidor: {{ inventory_hostname }}
          Sistema operativo: {{ ansible_distribution }} {{ ansible_distribution_version }}
        mode: '0644'

    - name: Mostrar mensaje si el sistema operativo es Ubuntu
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} ejecuta Ubuntu."
      when: ansible_distribution == 'Ubuntu'
